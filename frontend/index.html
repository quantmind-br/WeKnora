<!DOCTYPE html>
<html lang="en">
<head>
    <title>WeKnora</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="keywords" content="Q&A, WeChat dialog open platform, dialog open platform, dialog platform, AI customization, human-machine dialogue, intelligent Q&A, human-machine interaction, NLP, natural language processing, natural language understanding, AI products, open-source AI, AI algorithms, voice assistant"/>
    <meta name="description" content="WeKnora is an LLM-powered document understanding and semantic retrieval framework, built for complex, heterogeneous document scenarios."/>
    <link rel="shortcut icon" type="image/png" href="./public/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="120x120" type="image/png" href="./public/favicon.ico"/>
</head>
<body>
<script>
(function(){
  var t=localStorage.getItem('WeKnora_theme')||'light';
  if(t==='system')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.setAttribute('theme-mode',t);
  /* Matches --td-bg-color-page in theme.css, preventing the whole page background from jumping #fff -> #eee on style load (avoids repaint flash) */
  var bg=t==='dark'?'#181818':'#eee';
  document.documentElement.style.background=bg;
  document.documentElement.style.minHeight='100%';
  document.documentElement.style.colorScheme=t==='dark'?'dark':'light';
  document.body.style.background=bg;
  document.body.style.minHeight='100%';
  try{
    var w=window.runtime;
    if(w){
      if(t==='dark'){
        if(w.WindowSetDarkTheme)w.WindowSetDarkTheme();
        if(w.WindowSetBackgroundColour)w.WindowSetBackgroundColour(24,24,24,255);
      }else{
        if(w.WindowSetLightTheme)w.WindowSetLightTheme();
        if(w.WindowSetBackgroundColour)w.WindowSetBackgroundColour(238,238,238,255);
      }
    }
  }catch(_){}
})();
</script>
<script>
(function(){
  try {
    if (localStorage.getItem('weknora_lite_mode') !== 'true') return;
    var saved = sessionStorage.getItem('weknora_lite_last_path');
    if (!saved || saved.indexOf('/platform/') !== 0 || saved.indexOf('/platform/organizations') === 0) return;
    var path = window.location.pathname;
    if (path !== '/' && path !== '/platform' && path !== '/platform/knowledge-bases') return;
    var target = saved.indexOf('#') >= 0 ? saved.slice(0, saved.indexOf('#')) : saved;
    if (!target) return;
    var current = window.location.pathname + window.location.search;
    if (target !== current) window.history.replaceState(window.history.state, '', target);
  } catch (e) {}
})();
</script>
<script src="/config.js"></script>
<!--
  Offline-deployment compatibility: preload the tdesign-icons SVG sprite locally so tdesign-vue-next's
  <t-icon> does not call https://tdesign.gtimg.com at runtime (see issue #867 / #897).
  When upgrading tdesign-icons-vue-next, update public/tdesign-icons/<version>/fonts/index.js accordingly.
-->
<script src="/tdesign-icons/0.4.1/fonts/index.js"></script>
<div id="app"></div>
<script>
(function(){
  var t=localStorage.getItem('WeKnora_theme')||'light';
  if(t==='system')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  var bg=t==='dark'?'#181818':'#eee';
  var el=document.getElementById('app');
  if(el){ el.style.background=bg; el.style.minHeight='100%'; }
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
