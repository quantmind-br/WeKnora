# Optional dedicated embed origin — uncomment and set server_name (e.g. embed.example.com).
# Serve only embed.html + static assets; proxy /api to the WeKnora backend.
# See docs/embed-subdomain.md
#
# server {
#     listen 80;
#     server_name embed.example.com;
#     client_max_body_size ${MAX_FILE_SIZE};
#     location = /weknora-widget.js { root /usr/share/nginx/html; }
#     location ^~ /embed/ { root /usr/share/nginx/html; try_files $uri $uri/ /embed.html; }
#     location ^~ /assets/ { root /usr/share/nginx/html; add_header Cache-Control "public, max-age=31536000, immutable"; }
#     location /api/ { proxy_pass http://weknora-backend:8080; proxy_set_header Host $host; }
# }

server {
    listen 80;
    server_name localhost;
    # Default 50M, configured via MAX_FILE_SIZE_MB env var
    client_max_body_size ${MAX_FILE_SIZE};

    # Enable gzip compression for static assets (frontend index.js is a single ~1MB file; uncompressed, load time is 20s+ on test,
    # compressed it is ~200-300KB, cutting load time on low-bandwidth same-region machines from 25s to 3-5s)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml application/rss+xml image/svg+xml font/ttf font/otf;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Error log config
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    # Static widget loader for third-party sites
    location = /weknora-widget.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Internal fallback target for /embed/* routes. Keep it separate from the
    # main SPA location so embed pages do not inherit X-Frame-Options.
    location = /embed.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Embed widget pages may be loaded inside third-party iframes (lightweight embed.html)
    location ^~ /embed/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /embed.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # index.html and SPA fallback must not be cached, otherwise users won't see new versions after a frontend upgrade
        add_header Cache-Control "no-cache, must-revalidate" always;
        # nginx add_header does not inherit from parent blocks; security headers must be redeclared inside location
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite build output /assets/* has hashed filenames and can be cached long-term
    location ^~ /assets/ {
        root /usr/share/nginx/html;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Proxy locally stored files to the backend (used to render images inside markdown)
    # Exact match on /files to avoid Nginx auto-appending / and triggering a 301
    location = /files {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/files;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resource short link /r/<token>: IM channels rendering resource:// images depend on this route;
    # without it the request falls into the SPA fallback and returns a blank page, so images fail to load.
    location ^~ /r/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to the backend
    # APP_SCHEME defaults to http; can be set to https for a remote HTTPS backend
    location /api/ {
        proxy_pass ${APP_SCHEME}://${APP_HOST}:${APP_PORT}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Connection and retry config
        proxy_connect_timeout 30s;                 # Connection timeout
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;               # Retry count
        proxy_next_upstream_timeout 30s;           # Retry timeout
        
        # SSE-related config
        proxy_http_version 1.1;                    # Use HTTP/1.1
        proxy_set_header Connection "";            # Disable Connection: close to keep the connection open
        chunked_transfer_encoding off;             # Disable chunked transfer encoding
        proxy_buffering off;                       # Disable buffering
        proxy_cache off;                           # Disable caching
        proxy_read_timeout 3600s;                  # Increase read timeout
        proxy_send_timeout 3600s;                  # Increase send timeout
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
